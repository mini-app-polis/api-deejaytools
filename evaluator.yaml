# api-deejaytools / evaluator.yaml
# Per-repo evaluation configuration — ecosystem-standards ADR-0001, ADR-0002

type: api-service

layout_exceptions:
  - path: conformance
    reason: "The frozen conformance suite (docs/CONFORMANCE.md): the retired service's integration tests, run against this service to show it answers the same wire contract. Only this repo replaced a service on the same contract, so no other repo carries one."

exemptions:
  - rule: API-006
    reason: "events, sessions, session_divisions, event_division_run_limits, queue_entries, queue_events, runs and drive_jobs are shared operational data: admin-managed floor-trial and Drive-job state, written only under admin scopes (deejaytools.events.write, deejaytools.sessions.write, deejaytools.queue.manage, deejaytools.drivejobs.write), those same scopes held on one event by its staff (ADR-0012), or by the scheduler, and read by every attendee of an event. They fit none of API-006's three ownership patterns; created_by and actor_user_id are recorded for audit, not authorization. song_uploads (migration 003) is this service's internal build staging: one row per song, keyed by song_id and owned through songs.user_id, written by the upload route under the caller's deejaytools.songs.write scope and by the scheduler, and never read or listed over the API. event_staff_grants (migration 007) is likewise shared operational data: an event's staff list, written only under deejaytools.staff.write. Tables a person owns keep pattern 1, user_id holding the Clerk subject, which is the principal's subject. See ADR-0005, ADR-0008 and ADR-0012."

  - rule: API-004
    routes: [/internal/tick]
    reason: "GET /internal/tick is intentionally unversioned: operators, monitors and the conformance suite call it at that stable path to force one scheduler pass. It is gated by TICK_SECRET (x-tick-secret header), not Clerk, and fails closed when the secret is unset. All substantive routes are under /v1/. See ADR-0008 and ADR-0010."

  - rule: CD-030
    reason: "Not applicable: this API has no machine callers. Its one caller is the deejaytools.com web app, which sends Clerk session JWTs; there is no machine-key set to configure, and the only verifier is Clerk's for the one trusted issuer. CD-029 still applies and is graded. See ADR-0004 and ADR-0008. If a machine caller is ever planned, remove this exemption and add a named-key verifier in src/api_deejaytools/auth.py."
