name: deployed

# Runs when Railway reports a deploy (Railway posts GitHub deployments; the
# environments are named "<project> / development" and "<project> /
# production", after the Railway environments — not "dev")
# and smoke-tests the API that just went live, in either environment
# (CD-032).
#
# "Just went live" is checked, not assumed. A deployment_status of success
# can arrive while the public hostname still routes to the deploy being
# replaced, and /health or a 401 answer the same from either. So the job
# first waits until /version reports the deployment's own commit, and
# confirms it again after the checks, so every probe in between is known to
# have met the new deploy. Railway only switches traffic once /health
# answers (healthcheckPath in railway.json), which keeps that wait short.
#
# The hostnames are repository variables, not literals: until the cutover
# (deejaytools-api ADR-006) this service answers on its own Railway domains,
# and api-dev.deejaytools.com / api.deejaytools.com still point at
# deejaytools-api. At the cutover only the variables change.
#   API_URL_DEVELOPMENT   e.g. https://api-dev.deejaytools.com
#   API_URL_PRODUCTION    e.g. https://api.deejaytools.com
# (https:// is assumed when the value is a bare hostname).
#
# After a dev deploy it also asks deejaytools-com to run the live contract
# suite against it — the suite lives there, next to the schemas it checks.
# Triggering on the deploy rather than on the push means the suite meets the
# new API, not the one it replaced. Production only gets the read-only smoke
# test: the contract suite writes data and never runs there.
#
# That suite calls deejaytools-com's CONTRACT_API_URL and refuses any host
# but api-dev.deejaytools.com, which is deejaytools-api until the cutover.
# So the dispatch only fires once API_URL_DEVELOPMENT names that host, that
# is, once the dev domain points here; before that it would test the other
# service. At the cutover, remove the same job from deejaytools-api.
#
# The cross-repository trigger uses the promote GitHub App (the same org
# secrets as promote and automerge): a repository_dispatch needs a token
# with Contents: write on deejaytools-com, which GITHUB_TOKEN never has.
#
# GitHub cannot filter deployment_status by state or environment, so the
# statuses Railway posts before a deploy finishes start a run that skips.
#
# It can also be run by hand (Actions → deployed → Run workflow), choosing
# the environment: the same checks against whatever is serving there now,
# with no deploy to wait for, so the commit it reports is the one it found.
# On development it then triggers the contract suite too, unless unticked.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      environment:
        description: Which deployed API to check
        type: choice
        options: [development, production]
        default: development
      contract:
        description: Also run deejaytools-com's contract suite (development only)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       (endsWith(github.event.deployment.environment, '/ development') ||
        endsWith(github.event.deployment.environment, '/ production')))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.smoke.outputs.sha }}
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (endsWith(github.event.deployment.environment, '/ development') && 'development' || 'production') }}
      # Empty on a manual run: there is no deploy to wait for.
      SHA: ${{ github.event.deployment.sha }}
    steps:
      - name: Smoke-test the deployed API
        id: smoke
        env:
          API_URL_DEVELOPMENT: ${{ vars.API_URL_DEVELOPMENT }}
          API_URL_PRODUCTION: ${{ vars.API_URL_PRODUCTION }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          if [ "$TARGET" = development ]; then API="$API_URL_DEVELOPMENT"; else API="$API_URL_PRODUCTION"; fi
          [ -n "$API" ] \
            || fail "Set the API_URL_DEVELOPMENT and API_URL_PRODUCTION repository variables."
          # A bare hostname would be fetched over http and get Railway's
          # redirect instead of the API.
          case "$API" in http://*|https://*) ;; *) API="https://$API" ;; esac
          API="${API%/}"
          serving() { curl -fsS --max-time 10 "$API/version" 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true; }
          if [ -z "$SHA" ]; then
            # Manual run: check whatever is live, and name it.
            SHA="$(serving)"
            [ -n "$SHA" ] || fail "$API/version did not report a commit."
          else
            # Wait for the new deploy to be the one answering (up to 5 min).
            deadline=$(( $(date +%s) + 300 ))
            until [ "$(serving)" = "$SHA" ]; do
              [ "$(date +%s)" -lt "$deadline" ] \
                || fail "$API is still serving '$(serving)', not $SHA, 5 minutes after the deploy reported success."
              sleep 10
            done
          fi
          curl -fsS -o /dev/null "$API/health" \
            || fail "$API/health did not answer after the deploy."
          # An authenticated route without a token must refuse with the
          # error envelope — a 500 here means the app is up but broken.
          # Authentication runs before the handler, so this touches no data.
          code=$(curl -sS -o body.json -w '%{http_code}' "$API/v1/auth/me")
          [ "$code" = 401 ] || fail "$API/v1/auth/me without a token answered $code, not 401."
          jq -e '.error.code | type == "string"' body.json >/dev/null \
            || fail "$API/v1/auth/me answered 401 without the error envelope."
          # Still the same deploy — the probes above did not straddle a switch.
          [ "$(serving)" = "$SHA" ] \
            || fail "$API switched away from $SHA during the smoke test (now '$(serving)')."
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "API OK at $API ($SHA)"

  contract:
    needs: smoke
    if: >-
      contains(vars.API_URL_DEVELOPMENT, 'api-dev.deejaytools.com') &&
      ((github.event_name == 'workflow_dispatch' &&
        inputs.environment == 'development' && inputs.contract) ||
       (github.event_name != 'workflow_dispatch' &&
        endsWith(github.event.deployment.environment, '/ development')))
    runs-on: ubuntu-latest
    steps:
      - name: Mint an App token for deejaytools-com
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PROMOTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}
          owner: mini-app-polis
          repositories: deejaytools-com
          permission-contents: write

      - name: Run the contract suite against the API
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ needs.smoke.outputs.sha }}
        run: |
          gh api repos/mini-app-polis/deejaytools-com/dispatches \
            -f event_type=dev-api-deployed \
            -f "client_payload[api_sha]=$SHA"
          echo "Asked deejaytools-com to run the contract suite against $SHA."