[project]
name = "api-deejaytools"
dynamic = ["version"]
description = "FastAPI service behind deejaytools.com — events, floor-trial sessions and queues, check-ins, songs and their Drive files. Replaces deejaytools-api on the same database."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "httpx>=0.27,<1.0",
  # multipart/form-data parsing for POST /v1/songs/upload/chunk.
  "python-multipart>=0.0.18,<1.0",
  "boto3>=1.34,<2",
  "sentry-sdk[fastapi]>=2.0,<3.0",
  "miniapppolis-common-utils>=5.18.0,<6",
  "miniapppolis-identity[store]>=2.1,<3",
  # Audio tags written into uploaded songs (AUDIO-TAGGING.md; ADR-009).
  "mutagen>=1.47,<2",
  # IANA zones for event timezones, independent of the host image.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "pytest-cov>=5.0,<8.0",
  "respx>=0.21,<1.0",
  "pyjwt[crypto]>=2.8,<3.0",
  "mypy>=1.11.2",
  "pre-commit>=3.6,<5.0",
  "ruff>=0.7,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/api_deejaytools/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/api_deejaytools"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the app's engine is cached per process,
# and an asyncpg connection cannot be used from a loop other than the one
# that opened it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
# SQLAlchemy's async layer runs ORM code inside greenlets, which coverage
# does not follow by default: provisioning would read as never executed.
concurrency = ["thread", "greenlet"]
